name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: C protocol tests (host gcc)
        run: make -C tests/host test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python tool tests
        run: python -m unittest discover -s tools/tests -v

  build-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with ESP-IDF v5.1.4
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.1.4
          target: esp32
          path: firmware

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32
          path: |
            firmware/build/esp32_ota_bootloader.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/ota_data_initial.bin
